<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refusal traces</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.1.2/lib/marked.umd.min.js"></script>
<style>
:root { color-scheme:dark; --bg:#1a1a19; --panel:#232322; --line:#3a3a38; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8d8c84; --good:#5fb87a; --bad:#e0705f; }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
h1 { font-size:18px; margin:0 0 4px; } h2 { font-size:15px; margin:18px 0 8px; }
.sub { color:var(--ink2); font-size:13px; max-width:1500px; }
.note { color:var(--muted); font-size:12px; font-weight:400; }
.sw { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-1px; margin-right:6px; }
table { border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--ink2); font-weight:600; }
td.num, th.num { font-variant-numeric:tabular-nums; text-align:right; }
#counts { background:var(--panel); border:1px solid var(--line); }
#counts th.grp { text-align:center; border-left:1px solid var(--line); } #counts .first { border-left:1px solid var(--line); }
#counts td.cnt { cursor:pointer; } #counts td.cnt:hover { background:#333331; }
#pane { display:grid; height:calc(100vh - 32px); min-height:480px; border:1px solid var(--line); overflow:hidden; }
#pane > .col { overflow:auto; min-width:0; padding:10px; scrollbar-color:#55554f #1f1f1e; scrollbar-width:thin; }
#side { background:var(--panel); }
.divider { cursor:col-resize; background:var(--line); } .divider:hover, .divider.drag { background:var(--ink2); }
.filters { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin-bottom:10px; font-size:12px; color:var(--ink2); }
.filters label.f { display:flex; flex-direction:column; gap:3px; } .filters label.wide { grid-column:1 / -1; }
.filters select, .filters input[type=text] { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:0; padding:6px 8px; font:13px system-ui, sans-serif; }
.filters .chk { display:flex; align-items:center; gap:6px; color:var(--ink); }
.filters button.clr { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:0; padding:6px 8px; font:13px system-ui, sans-serif; cursor:pointer; } .filters button.clr:hover { background:#2b2b29; }
#list { width:100%; }
#list th { position:sticky; top:-10px; background:var(--panel); z-index:1; cursor:pointer; user-select:none; } #list th:hover { color:var(--ink); }
#list th.up::after, #list th.down::after { content:""; display:inline-block; margin-left:5px; border-left:4px solid transparent; border-right:4px solid transparent; vertical-align:2px; }
#list th.up::after { border-bottom:6px solid var(--ink); } #list th.down::after { border-top:6px solid var(--ink); }
#list tr.s { cursor:pointer; } #list tr.s:hover { background:#2a2a28; } #list tr.sel { background:#3a3a37; }
#list td.pr { max-width:0; width:99%; overflow:hidden; text-overflow:ellipsis; color:var(--ink2); }
.no { color:var(--bad); } .dim { color:var(--muted); }
.head { font-size:13px; margin-bottom:10px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
.head b { font-size:14px; }
.sec + .sec .sec-h { border-top:none; }
.sec-h { display:block; width:100%; text-align:left; background:#2b2b29; color:var(--ink); border:1px solid var(--line); border-radius:0; padding:7px 10px; font:600 13px system-ui, sans-serif; cursor:pointer; }
.sec-h:hover { background:#333331; }
.sec-h::before { content:""; display:inline-block; border-left:6px solid var(--ink2); border-top:4px solid transparent; border-bottom:4px solid transparent; margin-right:9px; vertical-align:1px; transform:rotate(90deg); }
.sec.closed .sec-h::before { transform:none; }
.sec-b { white-space:pre-wrap; word-break:break-word; font:12.5px/1.5 ui-monospace, monospace; background:var(--bg); border:1px solid var(--line); border-top:none; padding:8px 10px; }
.sec.closed .sec-b { display:none; }
.sec-b.md { white-space:normal; } .sec-b.md p, .sec-b.md ul, .sec-b.md ol, .sec-b.md table, .sec-b.md blockquote { margin:0 0 0.7em; } .sec-b.md > :last-child { margin-bottom:0; }
.sec-b.md h1, .sec-b.md h2, .sec-b.md h3, .sec-b.md h4 { font-size:1.05em; margin:0.8em 0 0.4em; color:var(--ink); } .sec-b.md ul, .sec-b.md ol { padding-left:1.6em; } .sec-b.md li { margin:0.15em 0; }
.sec-b.md pre { white-space:pre-wrap; background:var(--panel); border:1px solid var(--line); padding:6px 8px; margin:0 0 0.7em; } .sec-b.md code { background:var(--panel); padding:0 3px; } .sec-b.md pre code { background:none; padding:0; }
.sec-b.md th, .sec-b.md td { border:1px solid var(--line); padding:2px 6px; white-space:normal; } .sec-b.md blockquote { border-left:3px solid var(--line); padding-left:8px; color:var(--ink2); } .sec-b.md hr { border:0; border-top:1px solid var(--line); }
.sec-b.md .url { color:var(--muted); }
.empty { color:var(--muted); font-size:13px; padding:8px 0; }
</style></head><body>
<h1>Refusal traces: Qwen3.8-27B, base and with the refusal direction projected out</h1>
<div class="sub" id="settings"></div>
<div class="sub" id="models"></div>
<div class="sub" id="labels"></div>
<h2>Refusals / valid answers <span class="note">(click a count to list its rollouts)</span></h2>
<table id="counts"></table>
<h2>Rollouts <span class="note">(drag the divider to resize; arrow keys move through the list; column titles sort)</span></h2>
<div id="pane">
  <div class="col" id="side">
    <div class="filters">
      <label class="f">model<select id="f-model"></select></label>
      <label class="f">reasoning<select id="f-cot"><option value="">any</option><option value="0">off</option><option value="1">effort low</option></select></label>
      <label class="f">prompts<select id="f-arm"><option value="">any</option><option>harmful</option><option>harmless</option></select></label>
      <label class="f">sample<select id="f-s"><option value="">any</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label class="f">keyword label<select id="f-kw"><option value="">any</option><option value="1">refused</option><option value="0">not refused</option><option value="x">invalid (empty answer)</option></select></label>
      <label class="f">first-person label<select id="f-fp"><option value="">any</option><option value="1">refused</option><option value="0">not refused</option><option value="x">invalid (empty answer)</option></select></label>
      <label class="f wide">prompt contains (or a prompt number)<input type="text" id="f-q"></label>
      <label class="chk"><input type="checkbox" id="f-md" checked> render markdown</label>
      <button class="clr" id="f-clear">clear filters</button>
      <span class="note" id="nshown"></span>
    </div>
    <table id="list"></table>
  </div>
  <div class="divider"></div>
  <div class="col" id="view"></div>
</div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const model = Object.fromEntries(D.models.map(m => [m.id, m])), COT = ["off", "low"];
const sw = m => `<span class="sw" style="background:${m.color}"></span>`;
$("settings").textContent = `vLLM, heretic's 100 harmful and 100 harmless test prompts under the system prompt "${D.system}", 4 samples per prompt at temperature 1, top_p 0.95, top_k 20. Reasoning off: 1,024 answer tokens. Reasoning effort low: 4,096 tokens of reasoning and answer together.`;
$("models").innerHTML = "Models: " + D.models.map(m => `${sw(m)}<b>${esc(m.short)}</b> = ${esc(m.label)}`).join("; ") + ". The projection acts on the residual stream at every position; the direction at a layer is the harmful minus the harmless mean at the last prompt token with reasoning off.";
$("labels").textContent = `Labels, both read on the first ${D.chars} characters of the answer. Keyword: heretic's ${D.n_markers} markers, the env's label; a rollout lists the markers that matched. First-person: heretic's markers without the topical ones (${D.topical.join(", ")}), or one of "${D.phrases.join('", "')}". An empty answer is invalid and in neither count.`;

// markdown: raw html in model text is shown as text, images are not loaded, links are not clickable
if (window.marked) marked.use({renderer: {html: t => esc(t.text), image: t => esc(t.raw), link(t) { const text = this.parser.parseInline(t.tokens); return t.text === t.href ? text : `${text} <span class="url">[${esc(t.href)}]</span>`; }}});
try { $("f-md").checked = localStorage.getItem("refusal-traces-md") !== "0"; } catch (e) {}
const MD = () => !!window.marked && $("f-md").checked;
if (!window.marked) document.body.insertAdjacentHTML("afterbegin", `<div style="color:#e0705f;font-weight:600;margin-bottom:8px">marked did not load (offline?): text is shown raw.</div>`);

const kwv = s => !s.valid ? "x" : s.kw.length ? "1" : "0", fpv = s => !s.valid ? "x" : s.fp ? "1" : "0";
const tag = v => v === "x" ? `<span class="dim">invalid</span>` : v === "1" ? `<span class="no">refused</span>` : `<span class="dim">no</span>`;
const prompt = s => D.prompts[s.arm][s.p];

// counts: per model and cell, refusals / valid answers under each label
const CELLS = [["harmful", 0], ["harmful", 1], ["harmless", 0], ["harmless", 1]];
$("counts").innerHTML = `<tr><th rowspan="2">model</th>${CELLS.map(([a, c]) => `<th class="grp" colspan="2">${a} prompts, reasoning ${COT[c]}</th>`).join("")}</tr><tr>${CELLS.map(() => `<th class="num first">keyword</th><th class="num">first-person</th>`).join("")}</tr>`
  + D.models.map(m => `<tr><td>${sw(m)}${esc(m.short)}</td>` + CELLS.map(([a, c]) => {
      const xs = D.samples.filter(s => s.model === m.id && s.arm === a && s.cot === c && s.valid), f = {model: m.id, arm: a, cot: String(c)};
      return [["kw", xs.filter(s => s.kw.length).length], ["fp", xs.filter(s => s.fp).length]].map(([k, n], i) => `<td class="num cnt${i ? "" : " first"}" data-f="${esc(JSON.stringify({...f, [k]: "1"}))}">${n}/${xs.length}</td>`).join("");
    }).join("") + `</tr>`).join("");
$("counts").addEventListener("click", e => { const td = e.target.closest("td.cnt"); if (td) setFilters(JSON.parse(td.dataset.f)); });

// the selected rollout
let shown = [], sel = null;
const closed = new Set(["system prompt"]);   // sections start open except these; the choice carries over between rollouts
function sec(title, text, md) { return `<div class="sec${closed.has(title) ? " closed" : ""}" data-t="${title}"><button class="sec-h">${title}</button><div class="sec-b${md && MD() ? " md" : ""}">${md && MD() ? marked.parse(text, {breaks: true, gfm: true}) : esc(text)}</div></div>`; }
function show() {
  document.querySelectorAll("#list tr.s").forEach(tr => tr.classList.toggle("sel", +tr.dataset.id === sel));
  if (sel == null) { $("view").innerHTML = `<div class="empty">No rollout matches the filters.</div>`; return; }
  const s = D.samples[sel], m = model[s.model];
  $("view").innerHTML = `<div class="head">${sw(m)}<b>${esc(m.short)}</b><span>reasoning ${s.cot ? "effort low" : "off"}</span><span>${s.arm} prompt ${s.p}</span><span>sample ${s.s}</span>`
    + `<span>keyword label: ${tag(kwv(s))}${s.kw.length ? ` (${esc(s.kw.join(", "))})` : ""}</span><span>first-person label: ${tag(fpv(s))}</span><span>${s.answer.length} answer chars</span>${s.cut ? `<span class="no">cut at the token cap</span>` : ""}</div>`
    + sec("system prompt", D.system) + sec("user message", prompt(s)) + (s.cot ? sec("reasoning", s.reasoning || "(empty)", 1) : "") + sec("answer", s.answer || "(empty)", 1);
  $("view").scrollTop = 0;
  $("view").querySelectorAll(".sec-h").forEach(b => b.addEventListener("click", () => { const d = b.parentNode, t = d.dataset.t; closed.has(t) ? closed.delete(t) : closed.add(t); d.classList.toggle("closed"); }));
}

// the list: sort key, title, right-aligned
const COLS = [["p", "#", 1], ["model", "model"], ["cot", "cot"], ["s", "s", 1], ["kw", "keyword"], ["fp", "1st-person"], ["chars", "chars", 1], ["prompt", "prompt"]];
const SORT = {p: s => s.p, model: s => D.models.findIndex(m => m.id === s.model), cot: s => s.cot, s: s => s.s, kw: s => kwv(s), fp: s => fpv(s), chars: s => s.answer.length, prompt: s => prompt(s), arm: s => s.arm};
const FILTERS = ["model", "cot", "arm", "s", "kw", "fp"];
let sortBy = {k: "p", dir: 1};
function setFilters(f) { for (const k of FILTERS) $("f-" + k).value = f[k] ?? ""; $("f-q").value = f.q ?? ""; render(); }
function render() {
  const f = Object.fromEntries(FILTERS.map(k => [k, $("f-" + k).value])), q = $("f-q").value.trim().toLowerCase();
  shown = D.samples.map((s, i) => i).filter(i => { const s = D.samples[i];
    return (!f.model || s.model === f.model) && (!f.cot || String(s.cot) === f.cot) && (!f.arm || s.arm === f.arm) && (!f.s || String(s.s) === f.s) && (!f.kw || kwv(s) === f.kw) && (!f.fp || fpv(s) === f.fp)
      && (!q || (/^\d+$/.test(q) ? String(s.p) === q : prompt(s).toLowerCase().includes(q))); });
  const cmp = (x, y) => x < y ? -1 : x > y ? 1 : 0, by = k => (a, b) => cmp(SORT[k](D.samples[a]), SORT[k](D.samples[b]));   // the clicked column first, then prompts, prompt number, reasoning, model, sample
  shown.sort((a, b) => sortBy.dir * by(sortBy.k)(a, b) || by("arm")(a, b) || by("p")(a, b) || by("cot")(a, b) || by("model")(a, b) || by("s")(a, b));
  $("nshown").textContent = `${shown.length} shown`;
  $("list").innerHTML = `<tr>${COLS.map(([k, t, r]) => `<th data-k="${k}" class="${r ? "num " : ""}${sortBy.k === k ? (sortBy.dir > 0 ? "up" : "down") : ""}">${t}</th>`).join("")}</tr>`
    + shown.map(i => { const s = D.samples[i], m = model[s.model];
      return `<tr class="s" data-id="${i}"><td class="num">${s.p}</td><td>${sw(m)}${esc(m.short)}</td><td>${COT[s.cot]}</td><td class="num">${s.s}</td><td>${tag(kwv(s))}</td><td>${tag(fpv(s))}</td><td class="num">${s.answer.length}</td><td class="pr" title="${esc(prompt(s))}">${esc(prompt(s))}</td></tr>`; }).join("");
  if (!shown.includes(sel)) sel = shown.length ? shown[0] : null;
  $("side").scrollTop = 0;
  show();
}
$("list").addEventListener("click", e => {
  const th = e.target.closest("th"), tr = e.target.closest("tr.s");
  if (th) { sortBy = {k: th.dataset.k, dir: sortBy.k === th.dataset.k ? -sortBy.dir : 1}; render(); }
  else if (tr) { sel = +tr.dataset.id; show(); }
});
document.addEventListener("keydown", e => {
  if (!["ArrowDown", "ArrowUp"].includes(e.key) || ["SELECT", "INPUT"].includes(e.target.tagName) || !shown.length) return;
  const j = Math.max(0, Math.min(shown.length - 1, shown.indexOf(sel) + (e.key === "ArrowDown" ? 1 : -1)));
  e.preventDefault(); sel = shown[j]; show();
  document.querySelector(`#list tr.s[data-id="${sel}"]`).scrollIntoView({block: "nearest"});
});

// the divider: the list's width in px, kept in localStorage
let width = 620;
try { const w = +localStorage.getItem("refusal-traces-width"); if (w >= 180) width = w; } catch (e) {}
const applyW = () => $("pane").style.gridTemplateColumns = `${width}px 6px minmax(240px, 1fr)`;
const divider = document.querySelector(".divider");
divider.addEventListener("pointerdown", e => {
  e.preventDefault(); divider.setPointerCapture(e.pointerId); divider.classList.add("drag");
  const x0 = e.clientX, w0 = width;
  const move = ev => { width = Math.max(180, w0 + ev.clientX - x0); applyW(); };
  const up = () => { divider.classList.remove("drag"); divider.removeEventListener("pointermove", move); divider.removeEventListener("pointerup", up); try { localStorage.setItem("refusal-traces-width", width); } catch (e) {} };
  divider.addEventListener("pointermove", move); divider.addEventListener("pointerup", up);
});
applyW();

$("f-model").innerHTML = `<option value="">any</option>` + D.models.map(m => `<option value="${m.id}">${esc(m.short)}</option>`).join("");
for (const k of FILTERS) $("f-" + k).addEventListener("change", render);
$("f-q").addEventListener("input", render);
$("f-md").addEventListener("change", () => { try { localStorage.setItem("refusal-traces-md", $("f-md").checked ? "1" : "0"); } catch (e) {} show(); });
$("f-clear").addEventListener("click", () => setFilters({}));
setFilters({arm: "harmful"});
</script></body></html>
